seed: 2026
output_dir: outputs/default_run

data:
  train_dir: data/train
  val_dir: data/val
  raw_dataset_root: dataset/anomaly_db_v1
  image_size: [224, 224]
  local_window: 25

model:
  input_dim: 4
  hidden_dim: 128
  num_types: 4   # point / freq / trend / range
  text_layers: 2
  dropout: 0.1

train:
  epochs: 200
  batch_size: 8
  num_workers: 0
  lr: 0.0003
  min_lr: 0.00001
  weight_decay: 0.0001
  grad_clip: 1.0

loss_weights:
  point: 1.0
  seg: 1.0
  type: 1.0
  evidence: 0.5
  bc: 1.0
  cons: 0.2
  tv: 0.05
